[versions]
jackson3 = "3.2.2"
jackson2 = "2.22.2"
nanojson = "1.10"
netty = "4.2.17.Final"

[libraries]
archunit = "com.tngtech.archunit:archunit:1.5.0"
assertj = "org.assertj:assertj-core:3.27.7"
commons-lang3 = "org.apache.commons:commons-lang3:3.20.0"
errorprone-annotations = "com.google.errorprone:error_prone_annotations:2.50.0"
errorprone-core = "com.google.errorprone:error_prone_core:2.50.0"
spotbugs = "com.github.spotbugs:spotbugs-annotations:4.10.3"
jackson3-core = { module = "tools.jackson.core:jackson-core", version.ref = "jackson3" }
jackson3-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson3" }
jackson2-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson2" }
jackson2-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson2" }
jdave = "club.minnced:jdave-api:0.1.8"
jetbrains-annotations = "org.jetbrains:annotations:26.1.0"
jna = "net.java.dev.jna:jna:5.19.1"
junit = "org.junit.jupiter:junit-jupiter:6.1.3"
junit-launcher = "org.junit.platform:junit-platform-launcher:6.1.3"
logback-classic = "ch.qos.logback:logback-classic:1.6.3"
mockito = "org.mockito:mockito-core:5.23.0"
nanojson = { module = "com.grack:nanojson", version.ref = "nanojson" }
netty-codec-http = { module = "io.netty:netty-codec-http", version.ref = "netty" }
netty-codec-classes-quic = { module = "io.netty:netty-codec-classes-quic", version.ref = "netty" }
netty-handler = { module = "io.netty:netty-handler", version.ref = "netty" }
netty-tcnative-classes = "io.netty:netty-tcnative-classes:2.0.81.Final"
netty-transport-classes-epoll = { module = "io.netty:netty-transport-classes-epoll", version.ref = "netty" }
netty-transport-native-epoll = { module = "io.netty:netty-transport-native-epoll", version.ref = "netty" }
netty-transport-classes-kqueue = { module = "io.netty:netty-transport-classes-kqueue", version.ref = "netty" }
reactor-netty-http = "io.projectreactor.netty:reactor-netty-http:1.4.0-M1"
opus = "club.minnced:opus-java:1.1.1"
reflections = "org.reflections:reflections:0.10.2"
slf4j = "org.slf4j:slf4j-api:2.0.19"
tink = "com.google.crypto.tink:tink:1.23.0"
fastutil = "it.unimi.dsi:fastutil:8.5.19"
zstd = "com.github.luben:zstd-jni:1.5.7-16"

[bundles]
jackson3 = [
    "jackson3-core",
    "jackson3-databind",
]
jackson2 = [
    "jackson2-core",
    "jackson2-databind",
]
junit = [
    "junit",
    "junit-launcher",
]

[plugins]
errorprone = "net.ltgt.errorprone:5.1.1"
ideax = "org.jetbrains.gradle.plugin.idea-ext:1.4.1"
kotlin = "org.jetbrains.kotlin.jvm:2.4.10"
nmcp = "com.gradleup.nmcp:1.6.2"
nmcp-aggregation = "com.gradleup.nmcp.aggregation:1.6.2"
shadow = "com.gradleup.shadow:9.6.1"
spotless = "com.diffplug.spotless:8.10.2"
version-catalog-update = "nl.littlerobots.version-catalog-update:1.1.1"
versions = "com.github.ben-manes.versions:0.54.0"
